name: CI/CD - Production Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/final-tier2-app
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  # ==========================================
  # 1. KIỂM TRA LỖI CODE
  # ==========================================
  lint:
    name: Code Quality (Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies & Lint
        working-directory: app
        run: |
          npm ci
          npm run lint

  # ==========================================
  # 2. ĐÓNG GÓI DOCKER IMAGE
  # ==========================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Save Docker image to tar archive
        run: docker save -o image.tar ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Upload image artifact for next jobs
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  # ==========================================
  # 3. QUÉT BẢO MẬT (TRIVY SCAN)
  # ==========================================
  scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image from tar
        run: docker load -i image.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ==========================================
  # 4. ĐẨY LÊN DOCKER HUB
  # ==========================================
  push:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: scan
    if: github.event_name == 'push'
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image from tar
        run: docker load -i image.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} ${{ env.IMAGE_NAME }}:main-${{ github.run_number }}
          docker push ${{ env.IMAGE_NAME }}:main-${{ github.run_number }}

  # ==========================================
  # 5. DEPLOY LÊN AWS EC2
  # ==========================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: push
    if: github.event_name == 'push'
    steps:
      - name: Execute Zero-Downtime Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            echo "Starting Production Deployment"
            export APP_IMAGE="${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
            export APP_VERSION="${{ github.sha }}"

            cd /opt/final-tier2

            # Save old tag for rollback
            PREVIOUS_TAG=$(grep "^APP_IMAGE=" .env | cut -d'=' -f2 || echo "")
            sed -i "s|^PREVIOUS_IMAGE_TAG=.*|PREVIOUS_IMAGE_TAG=${PREVIOUS_TAG}|" .env

            # Update .env with new image
            sed -i "s|^APP_IMAGE=.*|APP_IMAGE=${APP_IMAGE}|" .env
            sed -i "s|^APP_VERSION=.*|APP_VERSION=${APP_VERSION}|" .env

            # Pull and deploy with Zero Downtime
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d --no-deps --scale app=2 --no-recreate app
            docker compose -f docker-compose.prod.yml up -d --no-deps --scale app=2 --force-recreate app
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

  # ==========================================
  # 6. KIỂM TRA SỨC KHỎE (HEALTH GATE)
  # ==========================================
  health-check:
    name: Health Gate Verification
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push'
    steps:
      - name: Wait for production services to stabilize
        run: sleep 15

      - name: Verify /health endpoint
        run: |
          HEALTH_RESPONSE=$(curl -fsS https://devops20.online/health)
          echo "$HEALTH_RESPONSE" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"|"ok"[[:space:]]*:[[:space:]]*true' || {
            echo "Health check failed."
            exit 1
          }

      - name: Verify /db endpoint
        run: |
          DB_RESPONSE=$(curl -fsS https://devops20.online/db)
          echo "$DB_RESPONSE" | grep -q '"ok"[[:space:]]*:[[:space:]]*true' || {
            echo "Database check failed."
            exit 1
          }
